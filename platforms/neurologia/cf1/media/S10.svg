<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" class="cf1-inline-svg cf1p10-root" id="cf1p10-svg" role="img" aria-labelledby="cf1p10-title cf1p10-desc" data-active="1" data-visual-slot="S10">
  <title id="cf1p10-title">Três selos-mantra para triagem sindrômica da cefaleia</title>
  <desc id="cf1p10-desc">Três selos interativos resumem a ordem do raciocínio: primeiro procurar alarmes e depois nomear a cefaleia; crises semelhantes com exame limpo favorecem cefaleia primária; uma dor diferente da habitual reabre a investigação.</desc>
  <defs>
    <linearGradient id="cf1p10-grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--cf1p10-bg-a, #0b1220)"/>
      <stop offset="55%" stop-color="var(--cf1p10-bg-b, #111a2b)"/>
      <stop offset="100%" stop-color="var(--cf1p10-bg-c, #17152d)"/>
    </linearGradient>
    <linearGradient id="cf1p10-grad-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--cf1p10-teal, #2dd4bf)" stop-opacity=".18"/>
      <stop offset="52%" stop-color="var(--cf1p10-gold, #fbbf24)" stop-opacity=".12"/>
      <stop offset="100%" stop-color="var(--cf1p10-indigo, #818cf8)" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="cf1p10-grad-seal-1" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="var(--cf1p10-teal-hi, #5eead4)"/>
      <stop offset="55%" stop-color="var(--cf1p10-teal, #14b8a6)"/>
      <stop offset="100%" stop-color="var(--cf1p10-teal-deep, #0f766e)"/>
    </radialGradient>
    <radialGradient id="cf1p10-grad-seal-2" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="var(--cf1p10-indigo-hi, #a5b4fc)"/>
      <stop offset="55%" stop-color="var(--cf1p10-indigo, #6366f1)"/>
      <stop offset="100%" stop-color="var(--cf1p10-indigo-deep, #4338ca)"/>
    </radialGradient>
    <radialGradient id="cf1p10-grad-seal-3" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="var(--cf1p10-coral-hi, #fda4af)"/>
      <stop offset="55%" stop-color="var(--cf1p10-coral, #f43f5e)"/>
      <stop offset="100%" stop-color="var(--cf1p10-coral-deep, #be123c)"/>
    </radialGradient>
    <linearGradient id="cf1p10-grad-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--cf1p10-panel-a, #1e293b)" stop-opacity=".96"/>
      <stop offset="100%" stop-color="var(--cf1p10-panel-b, #111827)" stop-opacity=".96"/>
    </linearGradient>
    <pattern id="cf1p10-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="var(--cf1p10-grid-line, #334155)" stroke-width="1" opacity=".32"/>
    </pattern>
    <filter id="cf1p10-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="cf1p10-glow-teal" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#2dd4bf" flood-opacity=".58" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cf1p10-glow-indigo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#818cf8" flood-opacity=".58" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cf1p10-glow-coral" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#f87171" flood-opacity=".58" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="cf1p10-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/>
    </marker>
    <marker id="cf1p10-arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#818cf8"/>
    </marker>
    <marker id="cf1p10-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f87171"/>
    </marker>
    <style>
      .cf1p10-root {
        --cf1p10-bg-a: var(--bg-0, #0b1220);
        --cf1p10-bg-b: var(--bg-1, #111a2b);
        --cf1p10-bg-c: #17152d;
        --cf1p10-panel-a: var(--bg-2, #1e293b);
        --cf1p10-panel-b: var(--bg-1, #111827);
        --cf1p10-ink: var(--ink, #e8eef8);
        --cf1p10-muted: var(--ink-mute, #94a3b8);
        --cf1p10-border: var(--border, #334155);
        --cf1p10-grid-line: #334155;
        --cf1p10-teal: var(--teal, #2dd4bf);
        --cf1p10-teal-hi: #5eead4;
        --cf1p10-teal-deep: #0f766e;
        --cf1p10-indigo: var(--indigo, #818cf8);
        --cf1p10-indigo-hi: #a5b4fc;
        --cf1p10-indigo-deep: #4338ca;
        --cf1p10-coral: var(--coral, #f87171);
        --cf1p10-coral-hi: #fda4af;
        --cf1p10-coral-deep: #be123c;
        --cf1p10-gold: var(--gold, #fbbf24);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      [data-theme="light"] .cf1p10-root {
        --cf1p10-bg-a: #f8fafc;
        --cf1p10-bg-b: #eef2ff;
        --cf1p10-bg-c: #fff7ed;
        --cf1p10-panel-a: #ffffff;
        --cf1p10-panel-b: #f8fafc;
        --cf1p10-ink: #0f172a;
        --cf1p10-muted: #475569;
        --cf1p10-border: #cbd5e1;
        --cf1p10-grid-line: #cbd5e1;
        color-scheme: light;
      }
      .cf1p10-bg { fill: url(#cf1p10-grad-bg); }
      .cf1p10-grid { fill: url(#cf1p10-grid); }
      .cf1p10-frame { fill: none; stroke: var(--cf1p10-border, #334155); stroke-width: 2; }
      .cf1p10-header { fill: url(#cf1p10-grad-header); stroke: var(--cf1p10-border, #334155); stroke-width: 1; }
      .cf1p10-kicker { fill: var(--cf1p10-teal, #2dd4bf); font-size: 13px; font-weight: 800; letter-spacing: 2.2px; }
      .cf1p10-heading { fill: var(--cf1p10-ink, #e8eef8); font-size: 30px; font-weight: 850; letter-spacing: -.6px; }
      .cf1p10-subheading { fill: var(--cf1p10-muted, #94a3b8); font-size: 14px; font-weight: 550; }
      .cf1p10-spine { fill: none; stroke: var(--cf1p10-border, #334155); stroke-width: 4; stroke-linecap: round; }
      .cf1p10-spine-hot { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; opacity: .78; }
      .cf1p10-seal { cursor: pointer; outline: none; }
      .cf1p10-seal-ring { fill: var(--cf1p10-panel-b, #111827); stroke: var(--cf1p10-border, #334155); stroke-width: 3; transition: stroke-width .2s ease, opacity .2s ease; }
      .cf1p10-seal-core { stroke: rgba(255,255,255,.48); stroke-width: 1.5; transition: transform .2s ease; transform-box: fill-box; transform-origin: center; }
      .cf1p10-seal:hover .cf1p10-seal-core,
      .cf1p10-seal:focus .cf1p10-seal-core { transform: scale(1.035); }
      .cf1p10-seal:focus .cf1p10-seal-ring { stroke: var(--cf1p10-gold, #fbbf24); stroke-width: 5; }
      .cf1p10-seal-number { fill: #ffffff; font-size: 15px; font-weight: 900; text-anchor: middle; }
      .cf1p10-seal-title { fill: var(--cf1p10-ink, #e8eef8); font-size: 16px; font-weight: 850; text-anchor: middle; }
      .cf1p10-seal-copy { fill: var(--cf1p10-muted, #94a3b8); font-size: 12px; font-weight: 600; text-anchor: middle; }
      .cf1p10-seal-icon { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .cf1p10-badge { fill: var(--cf1p10-panel-a, #1e293b); stroke: var(--cf1p10-border, #334155); stroke-width: 1.5; }
      .cf1p10-badge-text { fill: var(--cf1p10-muted, #94a3b8); font-size: 10px; font-weight: 800; letter-spacing: 1.1px; text-anchor: middle; }
      .cf1p10-panel { fill: url(#cf1p10-grad-panel); stroke: var(--cf1p10-border, #334155); stroke-width: 1.5; filter: url(#cf1p10-shadow); }
      .cf1p10-panel-tab { fill: var(--cf1p10-teal, #2dd4bf); }
      .cf1p10-panel-label { fill: var(--cf1p10-teal, #2dd4bf); font-size: 11px; font-weight: 850; letter-spacing: 1.6px; }
      .cf1p10-panel-title { fill: var(--cf1p10-ink, #e8eef8); font-size: 20px; font-weight: 850; }
      .cf1p10-panel-copy { fill: var(--cf1p10-muted, #94a3b8); font-size: 13px; font-weight: 550; }
      .cf1p10-panel-rule { fill: var(--cf1p10-gold, #fbbf24); font-size: 13px; font-weight: 800; }
      .cf1p10-active-dot { fill: var(--cf1p10-teal, #2dd4bf); opacity: .28; }
      .cf1p10-root[data-active="1"] .cf1p10-seal[data-seal="1"] .cf1p10-seal-ring { stroke: var(--cf1p10-teal, #2dd4bf); stroke-width: 6; }
      .cf1p10-root[data-active="2"] .cf1p10-seal[data-seal="2"] .cf1p10-seal-ring { stroke: var(--cf1p10-indigo, #818cf8); stroke-width: 6; }
      .cf1p10-root[data-active="3"] .cf1p10-seal[data-seal="3"] .cf1p10-seal-ring { stroke: var(--cf1p10-coral, #f87171); stroke-width: 6; }
      .cf1p10-root[data-active="1"] .cf1p10-active-dot { fill: var(--cf1p10-teal, #2dd4bf); }
      .cf1p10-root[data-active="2"] .cf1p10-active-dot { fill: var(--cf1p10-indigo, #818cf8); }
      .cf1p10-root[data-active="3"] .cf1p10-active-dot { fill: var(--cf1p10-coral, #f87171); }
      @keyframes cf1p10-pulse {
        0%, 100% { opacity: .18; transform: scale(.94); }
        50% { opacity: .42; transform: scale(1.06); }
      }
      .cf1p10-active-dot { animation: cf1p10-pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) {
        .cf1p10-active-dot { animation: none; }
        .cf1p10-seal-core { transition: none; }
      }
    </style>
  </defs>

