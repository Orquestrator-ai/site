  <rect class="cf1p10-panel" x="52" y="418" width="856" height="204" rx="20"/>
  <rect class="cf1p10-panel-tab" id="cf1p10-panel-tab" x="52" y="418" width="10" height="204" rx="5"/>
  <text class="cf1p10-panel-label" id="cf1p10-panel-label" x="86" y="456">SELO 1 · ORDEM DA PORTA</text>
  <text class="cf1p10-panel-title" id="cf1p10-panel-title" x="86" y="489">Primeiro o alarme; depois o nome.</text>
  <text class="cf1p10-panel-copy" id="cf1p10-panel-copy-1" x="86" y="522">Antes de classificar a cefaleia, pergunte se há idade de início atípica,</text>
  <text class="cf1p10-panel-copy" id="cf1p10-panel-copy-2" x="86" y="545">súbito/trovoada, progressão, despertar, sinais sistêmicos ou contexto de risco.</text>
  <text class="cf1p10-panel-rule" id="cf1p10-panel-rule" x="86" y="582">Regra operacional: alarme presente → secundária até investigar.</text>
