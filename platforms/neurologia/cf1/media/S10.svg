  </g>

  <script type="text/javascript"><![CDATA[
    (function () {
      var root = document.getElementById("cf1p10-svg");
      if (!root) return;

      var content = {
        "1": {
          label: "SELO 1 · ORDEM DA PORTA",
          title: "Primeiro o alarme; depois o nome.",
          line1: "Antes de classificar a cefaleia, pergunte se há idade de início atípica,",
          line2: "súbito/trovoada, progressão, despertar, sinais sistêmicos ou contexto de risco.",
          rule: "Regra operacional: alarme presente → secundária até investigar.",
          color: "#2dd4bf"
        },
        "2": {
          label: "SELO 2 · PADRÃO QUE SE REPETE",
          title: "Crises semelhantes + exame limpo.",
          line1: "Episódios com o mesmo padrão, intercrise estável e exame neurológico normal",
          line2: "favorecem o eixo de cefaleia primária — desde que nenhum alarme tenha surgido.",
          rule: "Regra operacional: repetição coerente + exame limpo sustenta o diagnóstico clínico.",
          color: "#818cf8"
        },
        "3": {
          label: "SELO 3 · QUEBRA DE PADRÃO",
          title: "Dor diferente da habitual reabre o caso.",
          line1: "Ter enxaqueca prévia não protege contra HSA, tumor ou outra causa secundária.",
          line2: "Mudou início, intensidade, duração, sintomas associados ou exame? Recomece a triagem.",
          rule: "Regra operacional: diferença relevante derruba a falsa segurança do histórico.",
          color: "#f87171"
        }
      };

      var label = document.getElementById("cf1p10-panel-label");
      var title = document.getElementById("cf1p10-panel-title");
      var copy1 = document.getElementById("cf1p10-panel-copy-1");
      var copy2 = document.getElementById("cf1p10-panel-copy-2");
      var rule = document.getElementById("cf1p10-panel-rule");
      var tab = document.getElementById("cf1p10-panel-tab");
      var seals = Array.prototype.slice.call(root.querySelectorAll(".cf1p10-seal"));

      function selectSeal(number, focus) {
        var item = content[number];
        if (!item) return;
        root.setAttribute("data-active", number);
        label.textContent = item.label;
        title.textContent = item.title;
        copy1.textContent = item.line1;
        copy2.textContent = item.line2;
        rule.textContent = item.rule;
        tab.setAttribute("fill", item.color);
        seals.forEach(function (seal) {
          var active = seal.getAttribute("data-seal") === number;
          seal.setAttribute("aria-pressed", active ? "true" : "false");
        });
        if (focus) {
          var target = root.querySelector('.cf1p10-seal[data-seal="' + number + '"]');
          if (target) target.focus();
        }
      }

      seals.forEach(function (seal, index) {
        var number = seal.getAttribute("data-seal");
        seal.addEventListener("click", function () { selectSeal(number, false); });
        seal.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectSeal(number, false);
          } else if (event.key === "ArrowRight" || event.key === "ArrowDown") {
            event.preventDefault();
            selectSeal(String((index + 1) % seals.length + 1), true);
          } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
            event.preventDefault();
            selectSeal(String((index + seals.length - 1) % seals.length + 1), true);
          }
        });
      });

      selectSeal("1", false);
    })();
  ]]></script>
</svg>
