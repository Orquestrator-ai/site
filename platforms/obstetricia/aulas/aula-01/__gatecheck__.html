  <!-- ================= CÓDIGO INTERATIVO (JS) ================= -->
  <script type="text/javascript">
    <![CDATA[
    const state = {
      umbSD: 3.0,
      cerSD: 4.0,
      dragging: null
    };

    // Configuração dos Sliders
    const sliderWidth = 340;
    const startX = 0;
    const endX = 340;

    // Conversores de Escala
    // Umbilical: 1.5 a 4.5
    function umbSDToX(val) {
      return ((val - 1.5) / 3.0) * sliderWidth;
    }
    function xToUmbSD(x) {
      return 1.5 + (x / sliderWidth) * 3.0;
    }

    // Cerebral Média: 1.5 a 5.5
    function cerSDToX(val) {
      return ((val - 1.5) / 4.0) * sliderWidth;
    }
    function xToCerSD(x) {
      return 1.5 + (x / sliderWidth) * 4.0;
    }

    // Geradores de Curva Doppler Clínica
    // Sístole fixada em y=15 (relação ao topo do box da curva, que tem h=100)
    // Diastole variável com base em S/D
    function generateDopplerPath(sd, baselineY, peakY) {
      const height = baselineY - peakY;
      const h_dia = height / sd;
      const y_dia = baselineY - h_dia;
      
      let path = "";
      // 3 Ciclos Cardíacos
      for (let i = 0; i < 3; i++) {
        const x0 = 35 + i * 90;
        if (i === 0) path += `M ${x0} ${y_dia} `;
        
        const xp = x0 + 18;
        const x_notch = x0 + 40;
        const y_notch = peakY + (y_dia - peakY) * 0.45;
        const x_dia = x0 + 65;
        const x_end = x0 + 90;
        
        path += `C ${x0+6} ${y_dia}, ${xp-5} ${peakY}, ${xp} ${peakY} ` + // Rápida subida sistólica
                `C ${xp+8} ${peakY}, ${x_notch-5} ${y_notch}, ${x_notch} ${y_notch} ` + // Incisura dicrota
                `C ${x_notch+6} ${y_notch+3}, ${x_dia-10} ${y_dia}, ${x_dia} ${y_dia} ` + // Descida para diástole
                `C ${x_dia+12} ${y_dia}, ${x_end-6} ${y_dia}, ${x_end} ${y_dia} `; // Fluxo diastólico final
      }
      return path;
    }

    // Atualização Geral da Interface
    function update() {
      // 1. Atualizar Umbilical
      const umbX = umbSDToX(state.umbSD);
      document.getElementById("p14-handle-umb").setAttribute("cx", umbX);
      document.getElementById("p14-fill-umb").setAttribute("width", umbX);
      document.getElementById("p14-val-umb").textContent = state.umbSD.toFixed(1);
      document.getElementById("p14-math-umb").textContent = state.umbSD.toFixed(1);
      
      const umbCurveStr = generateDopplerPath(state.umbSD, 90, 15);
