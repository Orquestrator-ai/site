  <script type="text/javascript">
    /*<![CDATA[*/
    let currentPega = 'correct';
    let pinnedLandmark = null;

    function setPega(pegaType) {
      currentPega = pegaType;
      pinnedLandmark = null;
      
      // Update Tabs
      const tabCorrect = document.getElementById('il1-tab-correct');
      const tabIncorrect = document.getElementById('il1-tab-incorrect');
      if (pegaType === 'correct') {
        tabCorrect.classList.add('il1-active-correct');
        tabIncorrect.classList.remove('il1-active-incorrect');
      } else {
        tabCorrect.classList.remove('il1-active-correct');
        tabIncorrect.classList.add('il1-active-incorrect');
      }

      // Update Forceps groups
      document.getElementById('il1-group-correct').style.display = pegaType === 'correct' ? 'block' : 'none';
      document.getElementById('il1-group-incorrect').style.display = pegaType === 'incorrect' ? 'block' : 'none';

      // Update interactive landmarks / highlights
      document.getElementById('il1-highlights-correct').style.display = pegaType === 'correct' ? 'block' : 'none';
      document.getElementById('il1-highlights-incorrect').style.display = pegaType === 'incorrect' ? 'block' : 'none';

      // Update info panel text
      updateInfoPanel();
    }

    function showTooltip(title, desc, evt) {
      if (pinnedLandmark) return;
      const tooltip = document.getElementById('il1-tooltip');
      const titleEl = document.getElementById('il1-tooltip-title');
      const descEl = document.getElementById('il1-tooltip-desc');
      const bgEl = document.getElementById('il1-tooltip-bg');
      
      titleEl.textContent = title;
      descEl.textContent = desc;

      // Adjust border color based on status
      let color = 'var(--il1-border)';
      if (title.includes('CORRETA') || title.includes('Ideal')) {
        color = 'var(--il1-color-correct)';
      } else if (title.includes('INCORRETA') || title.includes('Risco') || title.includes('Erro')) {
        color = 'var(--il1-color-incorrect)';
      }
      bgEl.setAttribute('stroke', color);

      const svg = document.getElementById('il1-svg-root');
      if (svg && evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        tooltip.setAttribute('transform', `translate(${svgP.x + 15}, ${svgP.y + 15})`);
        tooltip.setAttribute('opacity', '1');
      }
    }

    function moveTooltip(evt) {
      if (pinnedLandmark) return;
      const tooltip = document.getElementById('il1-tooltip');
      const svg = document.getElementById('il1-svg-root');
      if (svg && tooltip && tooltip.getAttribute('opacity') === '1') {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        tooltip.setAttribute('transform', `translate(${svgP.x + 15}, ${svgP.y + 15})`);
      }
    }

    function hideTooltip() {
      if (pinnedLandmark) return;
      const tooltip = document.getElementById('il1-tooltip');
      if (tooltip) {
        tooltip.setAttribute('opacity', '0');
      }
    }

    function selectLandmark(landmarkId) {
      if (pinnedLandmark === landmarkId) {
        pinnedLandmark = null;
        updateInfoPanel();
        hideTooltip();
      } else {
        pinnedLandmark = landmarkId;
        updateInfoPanel();
        // Hide tooltip when pinned to prevent overlap
        const tooltip = document.getElementById('il1-tooltip');
        if (tooltip) tooltip.setAttribute('opacity', '0');
      }
    }

    function updateInfoPanel() {
      // Hide all states
      const states = ['default-correct', 'default-incorrect', 'parietal', 'malar', 'mentum', 'ear-safe', 'ear-danger', 'orbit-danger'];
      states.forEach(s => {
        const el = document.getElementById(`il1-state-${s}`);
        if (el) el.style.display = 'none';
      });

      if (pinnedLandmark) {
        // Show specific landmark state
        let stateToShow = pinnedLandmark;
        if (pinnedLandmark === 'ear') {
          stateToShow = currentPega === 'correct' ? 'ear-safe' : 'ear-danger';
        } else if (pinnedLandmark === 'orbit' && currentPega === 'correct') {
          // If correct and user clicks eye/orbit, explain it is safe/free
          stateToShow = 'default-correct'; // Or we can make a specific one if needed
        }
        
        const targetEl = document.getElementById(`il1-state-${stateToShow}`);
        if (targetEl) {
          targetEl.style.display = 'block';
        }
      } else {
        // Show default active pega state
        const targetEl = document.getElementById(`il1-state-default-${currentPega}`);
        if (targetEl) {
          targetEl.style.display = 'block';
        }
      }
    }

    function resetView() {
      pinnedLandmark = null;
      updateInfoPanel();
      hideTooltip();
    }
    /*]]>*/
  </script>

        <text x="18" y="64" font-weight="bold">Paralisia Facial Perif&#233;rica</text>

        <text x="0" y="95" font-weight="bold" fill="var(--il1-color-correct)">Evita les&#245;es cerebrais</text>
        <text x="0" y="112" font-size="11" fill="var(--il1-text-secondary)">A press&#227;o em ossos n&#227;o-parietais (como frontal</text>

      <text x="90" y="111" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="var(--il1-color-correct)" text-anchor="middle">APOIO FACIAL</text>

      <text x="25" y="150" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="var(--il1-text)">Regi&#227;o Malar (Zigom&#225;tica)</text>
      <text x="25" y="170" font-family="system-ui, sans-serif" font-size="11" fill="var(--il1-text-secondary)">A ma&#231;&#227; do rosto do rec&#233;m-nascido</text>

        <text x="0" y="32" font-size="11" fill="var(--il1-text-secondary)">Na pega incorreta (toda deslocada para tr&#225;s</text>
