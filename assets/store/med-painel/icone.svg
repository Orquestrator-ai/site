<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="Med Painel">
  <!-- O selo do Med Painel, copiado do canon (src/views/medpainel/estilo.tsx, Selo): o degradê dourado da variável
       mpv-selo (linear-gradient 160deg, #c9a85a a #8d6d26) e a estrela ESTRELA em traço branco (mpv-branco), 1.8 de
       traço num desenho de 24, ocupando 52% do lado. O quadrado vai cheio: o canto é a máscara do cartão da Store, como
       nos outros ícones. Atenção: comentário de SVG não aceita dois hífens seguidos (o arquivo vira XML inválido). -->
  <defs>
    <linearGradient id="selo" x1="0.33" y1="0.03" x2="0.67" y2="0.97">
      <stop offset="0" stop-color="#c9a85a"/>
      <stop offset="1" stop-color="#8d6d26"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#selo)"/>
  <g transform="translate(46.08 46.08) scale(4.16)">
    <path d="M12 3l2.2 5.1L20 9.3l-4.4 3.9L17 19l-5-2.9L7 19l1.4-5.8L4 9.3l5.8-1.2z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
