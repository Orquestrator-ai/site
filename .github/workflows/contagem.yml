name: Publicar Contagem
on:
  push:
    branches: ['contagem/servico']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-contagem-netlify
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Testar o serviço
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test testes/*.test.mjs
      - name: Instalar a CLI oficial da Netlify
        run: npm ci --prefix .github/netlify-cli --ignore-scripts --no-audit --no-fund
      - name: Publicar no projeto dedicado
        id: publicacao
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          AWS_LAMBDA_JS_RUNTIME: nodejs24.x
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo '::error::Este repositório precisa de autorização de deploy para publicar manualmente pelo GitHub.'
              exit 1
            fi
            echo 'Testes concluídos. A produção é publicada pela CLI vinculada ao projeto do Contagem.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run preparar:navegador
          .github/netlify-cli/node_modules/.bin/netlify deploy --prod --site c7c512f4-9497-49b7-9fe1-29212cb84ff9
          echo 'enviado=true' >> "$GITHUB_OUTPUT"
      - name: Conferir armazenamento e acesso privado
        if: steps.publicacao.outputs.enviado == 'true'
        run: node ferramentas/conferir-producao.mjs
